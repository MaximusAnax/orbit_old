[project]
name = "orbit"
version = "0.1.0"
description = "Automated prediction-market trading system (Kalshi + Polymarket)"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "websockets>=12.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "cryptography>=42.0",
    "structlog>=24.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "orjson>=3.10",
    "tenacity>=8.2",
]

[project.optional-dependencies]
analysis = [
    "polars>=0.20",
    "numpy>=1.26",
    "scipy>=1.12",
    "duckdb>=0.10",
]
web3 = [
    "eth-account>=0.11",
    "web3>=6.15",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "hypothesis>=6.99",
    "ruff>=0.3",
    "mypy>=1.9",
]

[project.scripts]
orbit = "orbit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orbit"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "N"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
disallow_untyped_defs = true
mypy_path = "src"
packages = ["orbit"]

[[tool.mypy.overrides]]
module = ["web3.*", "eth_account.*", "duckdb.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "live: tests that hit real venue APIs (require credentials, skipped by default)",
    "slow: long-running tests",
]
